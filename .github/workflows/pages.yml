name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Valores PÚBLICOS: la seguridad la aplica Row Level Security.
          VITE_SUPABASE_URL: https://jmtglvtvfikiqfomrqgp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_K9JVAGVQTPbHH0FPHiwUQw_cRa3V3IK
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Publicar dist/ en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Publicación ${{ github.sha }}"
